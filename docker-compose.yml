services:
  mysql:
    image: mysql:8.4
    # 注意: 这里的 ${...} 从【仓库根目录的 .env】插值 (不是 backend/.env)!
    # 部署时需在根目录建 .env, 含 MYSQL_DB / MYSQL_USER / MYSQL_PASSWORD 三行
    environment:
      MYSQL_DATABASE: ${MYSQL_DB:?请在仓库根目录 .env 里配置 MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER:?请在仓库根目录 .env 里配置 MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在仓库根目录 .env 里配置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # 容器之间用服务名互相访问，不再走 127.0.0.1 (environment 优先级高于 env_file)
      MYSQL_HOST: mysql
      REDIS_URL: redis://redis:6379/0
      HF_ENDPOINT: https://hf-mirror.com
      # RAG embedding 模型缓存持久化, 重建容器不用重新下载几百 MB
      HF_HOME: /app/hf-cache
    volumes:
      - uploads:/app/uploads
      - hf-cache:/app/hf-cache
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  uploads:
  hf-cache:
