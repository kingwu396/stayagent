[project]
name = "stayagent-backend"
version = "0.1.0"
description = "StayAgent 后端 API - AI Travel Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.1",
    "sqlalchemy>=2.0.27",
    "pymysql>=1.1.0",
    "cryptography>=42.0.5",
    "python-dotenv>=1.0.1",
    "pydantic>=2.6.1",
    "pydantic-settings>=2.2.1",
    "bcrypt>=4.1.0",
    "python-jose[cryptography]>=3.3.0",
    "email-validator>=2.1.0",
    "redis>=5.0.0",
    "httpx>=0.28.0",
    "tenacity>=8.2.0",
    "pdfplumber>=0.11.0",
    "sentence-transformers>=3.0.0",
    # RAG embedding 底层. 显式声明以强制走下方 pytorch-cpu 源:
    # 服务器无 GPU, 默认全量 torch 会拖进 ~1GB 的 CUDA 库 (cudnn/triton), 纯浪费
    "torch>=2.2",
    "numpy>=1.24.0",
    "python-multipart>=0.0.9",
    "fpdf2>=2.8.9",
    "mcp>=1.2,<2",
]

# torch 锁定 CPU 版 (~200MB, 无 CUDA 依赖)
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
